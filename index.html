<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Report Studio - Fixed Importer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root {
      --primary: #5c1816;
      --primary-grad: linear-gradient(135deg, #5c1816 0%, #802320 100%);
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --font-scale: 100%;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 420px;
      min-width: 420px;
      background: var(--panel-bg);
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 20;
      box-shadow: 4px 0 20px rgba(0,0,0,0.4);
    }

    .sidebar-header {
      padding: 16px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-family: 'Prompt', sans-serif;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 600;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .import-box {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      background: #0f172a;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .import-box:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-family: 'Sarabun', sans-serif;
      font-size: 0.88rem;
