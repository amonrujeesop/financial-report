<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Report Studio - Blank Slate</title>
  
  <!-- Google Fonts: Prompt & Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Chart.js, SheetJS, Mammoth.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root {
      --primary: #5c1816;
      --primary-grad: linear-gradient(135deg, #5c1816 0%, #802320 100%);
      --bg-slate: #0f172a;
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --font-scale: 100%;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 420px;
      min-width: 420px;
      background: var(--panel-bg);
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 20;
      box-shadow: 4px 0 20px rgba(0,0,0,0.4);
    }

    .sidebar-header {
      padding: 16px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-family: 'Prompt', sans-serif;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 600;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .import-box {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      background: #0f172a;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .import-box:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-family: 'Sarabun', sans-serif;
      font-size: 0.88rem;
    }

    .btn {
      padding: 9px 14px;
      border-radius: 6px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary { background: #0284c7; color: white; width: 100%; }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary { background: #334155; color: white; }

    #main-preview {
      flex: 1;
      background: #1e293b;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-toolbar {
      width: 210mm;
      background: #0f172a;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .a4-paper {
      width: 210mm;
      height: 296.8mm;
      background: #ffffff;
      color: #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 9mm 11mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: var(--font-scale);
      overflow: hidden;
    }

    [contenteditable="true"] {
      border-radius: 2px;
      transition: all 0.2s;
    }
    [contenteditable="true"]:hover {
      outline: 1px dashed #0284c7;
      background-color: rgba(2, 132, 199, 0.05);
    }
    [contenteditable="true"]:focus {
      outline: 2px solid #0284c7;
      background-color: #fff;
    }

    .header-banner {
      background: var(--primary-grad);
      color: white;
      padding: 8px 12px;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 6px;
    }

    .header-banner h1 {
      font-family: 'Prompt', sans-serif;
      font-size: 15pt;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-banner p { font-size: 9pt; opacity: 0.95; margin-top: 1px; }

    .exec-summary-box {
      background-color: #fffbe6;
      border-left: 4px solid #d97706;
      padding: 6px 10px;
      font-size: 8.5pt;
      margin-bottom: 6px;
      border-radius: 0 4px 4px 0;
      line-height: 1.35;
    }
    .exec-summary-box strong { color: #b45309; }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 10px;
      flex: 1;
    }

    .section-card {
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 7px 9px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      border-bottom: 1.5px solid var(--primary);
      padding-bottom: 2px;
    }

    .section-number {
      background: var(--primary);
      color: white;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7.5pt;
      font-weight: bold;
    }

    .section-title {
      font-family: 'Prompt', sans-serif;
      font-size: 9pt;
      font-weight: 600;
      color: var(--primary);
    }

    .section-body {
      font-size: 7.8pt;
      line-height: 1.3;
      color: #334155;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 102px;
      margin: 2px 0;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 7.5pt;
      margin-top: 3px;
    }

    .data-table th, .data-table td {
      border: 1px solid #cbd5e1;
      padding: 2.5px 4px;
      text-align: right;
    }

    .data-table th {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 600;
      text-align: center;
    }

    .data-table td:first-child { text-align: left; }
    .highlight-val { color: #b91c1c; font-weight: bold; }
    .placeholder-txt { color: #94a3b8; font-style: italic; }

    .signature-area {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed #cbd5e1;
      font-size: 7.8pt;
      color: #64748b;
    }

    @media print {
      body { background: white !important; color: black !important; }
      #sidebar, .preview-toolbar { display: none !important; }
      #main-preview { padding: 0 !important; background: white !important; }
      .a4-paper {
        box-shadow: none !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 296.8mm !important;
        page-break-after: always;
      }
      [contenteditable="true"]:hover { outline: none !important; background: transparent !important; }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- Left Controls -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>📊 Report Studio</h2>
      <button class="btn btn-secondary" style="width:auto; padding:4px 8px; font-size:0.75rem;" onclick="clearAllData()">🧹 ล้างข้อมูล</button>
    </div>

    <div class="sidebar-content">
      <!-- File Importers -->
      <div class="import-box" onclick="document.getElementById('file-excel').click()">
        <p style="font-size:0.85rem; color:#38bdf8;"><strong>📊 นำเข้าไฟล์ Excel (.xlsx / .xls)</strong></p>
        <span style="font-size:0.75rem; color:#94a3b8;">ดึงตัวเลขและตารางเข้ากระดาษอัตโนมัติ</span>
        <input type="file" id="file-excel" style="display:none;" onchange="handleExcelImport(event)">
      </div>

      <div class="import-box" onclick="document.getElementById('file-word').click()">
        <p style="font-size:0.85rem; color:#38bdf8;"><strong>📝 นำเข้าไฟล์ Word (.docx / .doc)</strong></p>
        <span style="font-size:0.75rem; color:#94a3b8;">ดึงข้อความสรุปผู้บริหารอัตโนมัติ</span>
        <input type="file" id="file-word" style="display:none;" onchange="handleWordImport(event)">
      </div>

      <hr style="border-color:#334155; margin:15px 0;">

      <!-- Blank Form Controls -->
      <div class="form-group">
        <label>หัวข้อรายงานหลัก</label>
